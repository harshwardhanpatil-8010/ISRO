version: '3.8'

services:
  geoai-app:
    # Build the Docker image from the Dockerfile in the current directory.
    build:
      context: .
      # Optional: Add build arguments here if needed
      # args:
      #   - ARG_NAME=value

    # Name for the running container.
    container_name: geoai_app

    # Restart policy to ensure the service comes back up after a crash or reboot.
    restart: unless-stopped

    # Environment file for managing secrets and configurations.
    # Create a .env file in the same directory with your secrets.
    # Example .env file content:
    # BHOONIDHI_API_KEY=your_api_key_here
    env_file:
      - .env

    # You can also pass environment variables directly.
    # environment:
    #   - BHOONIDHI_API_KEY=${BHOONIDHI_API_KEY}

    # Port mapping: <HOST_PORT>:<CONTAINER_PORT>
    # Access the Streamlit app on http://localhost:8501
    ports:
      - "8501:8501"

    # Volumes for data persistence.
    # This ensures that generated outputs, logs, and cache are not lost when the container is stopped or removed.
    volumes:
      - ./outputs:/app/outputs
      - ./cache:/app/cache
      - ./logs:/app/logs
